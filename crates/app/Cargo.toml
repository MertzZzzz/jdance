jdance-commands.workspace = true
jdance-domain.workspace = true
jdance-dsp.workspace = true
jdance-engine.workspace = true
jdance-mp3.workspace = true
jdance-scripts.workspace = true
jdance-persistence.workspace = true
jdance-plugin-api.workspace = true
jdance-plugin-vst3.workspace = true
jdance-ui.workspace = true
eframe.workspace = true
midir.workspace = true
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
hound.workspace = true
jdance-test-support.workspace = true
tempfile.workspace = true

[lints]
workspace = true
