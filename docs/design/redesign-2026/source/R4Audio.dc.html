<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>R4 · Audio settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2B3038}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:640px;height:700px;box-sizing:border-box;background:#2B3038;padding:20px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:#E9ECEF">
<div style="width:600px;height:660px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:#171A1E;border:1px solid #39404A;box-shadow:0 18px 50px rgba(0,0,0,.5)">

<div style="height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;background:#13161A;border-bottom:1px solid #2A3037">
<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#A7AFB8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2zM11.5 5.5a3.5 3.5 0 0 1 0 5M13.5 3.5a6.5 6.5 0 0 1 0 9"></path></svg>
<span style="font-weight:600;font-size:13px">Audio settings</span>
<div style="flex:1"></div>
<button aria-label="Close" style="width:26px;height:26px;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#A7AFB8" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
</div>

<div style="flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:12px">
<!-- status banner -->
<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:rgba(95,168,107,.1);border:1px solid rgba(95,168,107,.4)">
<span style="width:10px;height:10px;border-radius:50%;background:#5FA86B;box-shadow:0 0 8px rgba(95,168,107,.7)"></span>
<div style="display:flex;flex-direction:column;flex:1"><span style="font-weight:500">Stream running</span><span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#A7AFB8">WASAPI · Speakers (Realtek) · 48 000 Hz · 256 smp</span></div>
<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8FD19E">5.3 ms</span>
</div>

<!-- Device -->
<div style="border-radius:9px;background:#13161A;border:1px solid #22272D;padding:12px;display:flex;flex-direction:column;gap:10px">
<span style="display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1px;color:#7E8792"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#7E8792" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12v8H2zM5 14h6M8 11v3"></path></svg>DEVICE</span>
<sc-for list="{{rowsDev}}" as="r" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:10px">
<span style="width:96px;font-size:11.5px;color:#A7AFB8">{{r.label}}</span>
<button style="flex:1;min-width:0;height:30px;padding:0 10px;border:1px solid #39404A;border-radius:7px;background:#252A30;color:#E9ECEF;font-size:12px;display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#A7AFB8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.path}}"></path></svg><span style="flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.value}}</span><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="#A7AFB8" stroke-width="1.4" fill="none"></path></svg></button>
<sc-if value="{{r.refresh}}" hint-placeholder-val="{{ false }}"><button aria-label="Refresh devices" title="Refresh" style="width:30px;height:30px;border:1px solid #39404A;border-radius:7px;background:#252A30;display:flex;align-items:center;justify-content:center"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#E9ECEF" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"></path></svg></button></sc-if>
</div>
</sc-for>
<button title="ASIO only" style="align-self:flex-start;margin-left:106px;height:26px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:#5A626C;font-size:11px;display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#5A626C" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10M6 2.5v3M10 6.5v3M5 10.5v3"></path></svg>Driver control panel (ASIO)</button>
</div>

<!-- Format -->
<div style="border-radius:9px;background:#13161A;border:1px solid #22272D;padding:12px;display:flex;flex-direction:column;gap:10px">
<span style="display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1px;color:#7E8792"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#7E8792" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1 8h2l1.5-4 2 8 2-10 2 9 1.5-3H15"></path></svg>FORMAT</span>
<div style="display:flex;align-items:center;gap:10px">
<span style="width:96px;font-size:11.5px;color:#A7AFB8">Sample rate</span>
<div style="flex:1;display:flex;background:#0F1215;border:1px solid #2A3037;border-radius:7px;padding:2px;gap:1px">
<sc-for list="{{rates}}" as="s" hint-placeholder-count="4"><button style="{{s.style}}">{{s.n}}</button></sc-for>
</div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<span style="width:96px;font-size:11.5px;color:#A7AFB8">Buffer size</span>
<div style="flex:1;display:flex;background:#0F1215;border:1px solid #2A3037;border-radius:7px;padding:2px;gap:1px">
<sc-for list="{{bufs}}" as="s" hint-placeholder-count="6"><button style="{{s.style}}">{{s.n}}</button></sc-for>
</div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<span style="width:96px;font-size:11.5px;color:#A7AFB8">Output pair</span>
<button style="flex:1;height:30px;padding:0 10px;border:1px solid #39404A;border-radius:7px;background:#252A30;color:#E9ECEF;font-size:12px;display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#A7AFB8" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 3v10M11 3v10M3 8h4M9 8h4"></path></svg><span style="flex:1;text-align:left">Outputs 1 / 2</span><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="#A7AFB8" stroke-width="1.4" fill="none"></path></svg></button>
</div>
</div>

<!-- Stream stats -->
<div style="border-radius:9px;background:#13161A;border:1px solid #22272D;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:9.5px;letter-spacing:1px;color:#7E8792">{{s.label}}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px">{{s.value}}</span></div>
</sc-for>
</div>

<div style="flex:1"></div>
<div style="display:flex;align-items:center;gap:8px">
<button style="height:32px;padding:0 12px;border:1px solid #39404A;border-radius:7px;background:transparent;color:#FF9C8F;font-size:12px;display:flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#FF9C8F" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 2v5.5M4.5 4.5a5 5 0 1 0 7 0"></path></svg>Close device</button>
<div style="flex:1"></div>
<span style="font-size:10.5px;color:#FFC27A;display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#FFC27A"></span>Buffer changed — not applied</span>
<button style="height:32px;padding:0 16px;border:0;border-radius:7px;background:#F5B544;color:#1B1405;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#1B1405" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5"></path></svg>Apply</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const rowsDev = [
      ['Backend','WASAPI','M2 4h12v8H2zM5 8h6',false],
      ['Device','Speakers (Realtek High Definition Audio)','M2 6h3l4-3v10l-4-3H2z',true],
      ['Input','Microphone Array (Realtek)','M8 2a2 2 0 0 1 2 2v4a2 2 0 0 1-4 0V4a2 2 0 0 1 2-2zM4 8a4 4 0 0 0 8 0M8 12v2',false],
    ].map(([label, value, path, refresh]) => ({ label, value, path, refresh }));
    const seg = (on, dis) => 'flex:1;height:26px;border:0;border-radius:5px;font-family:IBM Plex Mono,monospace;font-size:11px;' + (on ? 'background:#1F3550;color:#E9ECEF;box-shadow:inset 0 0 0 1px #5AA9FF' : dis ? 'background:transparent;color:#3E454E' : 'background:transparent;color:#A7AFB8');
    const rates = [['44.1k',false,false],['48k',true,false],['88.2k',false,true],['96k',false,false]].map(([n,on,dis]) => ({ n, style: seg(on, dis) }));
    const bufs = [['64',false],['128',false],['256',true],['512',false],['1024',false],['Auto',false]].map(([n,on]) => ({ n, style: seg(on, false) }));
    const stats = [['STATE','running'],['CALLBACKS','182 304'],['OBSERVED BUFFER','256 smp'],['SAMPLE FORMAT','f32'],['LATENCY IN','5.8 ms'],['LATENCY OUT','5.3 ms']].map(([label, value]) => ({ label, value }));
    return { rowsDev, rates, bufs, stats };
  }
}
</script>
</body>
</html>
