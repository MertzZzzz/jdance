<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>R2 · Иконки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
</style>
</helmet>
<div style="width:760px;height:900px;box-sizing:border-box;background:#0E1013;color:#E9ECEF;font-family:'IBM Plex Sans',sans-serif;padding:28px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-direction:column;gap:4px">
<span style="font-weight:600;font-size:18px">Иконки jdance</span>
<span style="font-size:12px;color:#A7AFB8">Сетка 16×16, линия 1.5 px, рисуются фигурами (egui Shape), цвет MUTED / TEXT у активной</span>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:9.5px;letter-spacing:1px;color:#7E8792">{{g.title}}</span>
<div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px">
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="8">
<div style="height:66px;border-radius:8px;background:#171A1E;border:1px solid #2A3037;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px">
<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#E9ECEF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{i.name}}"><path d="{{i.path}}"></path></svg>
<span style="font-size:10px;color:#A7AFB8">{{i.name}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
