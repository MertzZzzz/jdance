[package]
name = "jdance-plugin-vst3"
description = "VST3 hosting: module loading, scanning and instances (PLG-010..036)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jdance-plugin-api.workspace = true
libloading = "0.8.9"
vst3 = "0.3.0"
rtrb.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"
x11rb = "0.13.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
] }

[[test]]
name = "editor"
harness = false

[[bin]]
name = "jdance-plugin-scanner"
path = "src/bin/scanner.rs"

[dev-dependencies]
jdance-rt-check.workspace = true
jdance-test-support.workspace = true

# The editor test presses Space with XTEST (spec 0.2.3 KEY-004).
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[lints]
workspace = true
