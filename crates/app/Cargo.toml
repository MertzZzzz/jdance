version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jdance"
path = "src/main.rs"

[dependencies]
jdance-audio-api.workspace = true
jdance-audio-cpal.workspace = true
