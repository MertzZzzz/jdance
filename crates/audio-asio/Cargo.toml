[package]
name = "jdance-audio-asio"
description = "ASIO host adapter implementing jdance-audio-api (ADR-006): third-party ASIO drivers on Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jdance-audio-api.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[features]
# The Rust test driver (ASIO-050), for tests of crates using the backend.
test-driver = []
